[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "askfirst"
version = "0.1.0"
description = "Ask your SQLite database questions in English. It asks back when a question is vague, instead of guessing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Devansh" }]
keywords = ["text-to-sql", "sqlite", "llm", "clarification", "nl2sql"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Database",
]
dependencies = []                      # the core is pure standard library

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
askfirst = "askfirst.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
askfirst = ["domains/*/*.json", "domains/*/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
